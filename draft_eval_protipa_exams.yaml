task: greek_protipa_exams
dataset_path: PennyK98/protipa_exams_dataset
dataset_name: default
test_split: test 
output_type: multiple_choice
doc_to_text: |
  {% if input %}{{input}}
  {% endif %}Ερώτηση: {{question}}
  Απάντηση:
doc_to_choice: "{{choices}}"
doc_to_target: "{{answer_index.split(',')[0] | int}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  task_type: multiple_choice